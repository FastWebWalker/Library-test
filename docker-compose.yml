version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: books_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: booksdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: books_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/booksdb
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: always

  client:
    build: ./client
    environment:
      - API_URL=http://server:5000
    depends_on:
      - server
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data:
  pgadmin_data:
